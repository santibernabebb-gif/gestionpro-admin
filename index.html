<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>GestionPro Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px;max-width:600px}
input,button{padding:8px;margin:5px}
</style>

</head>
<body>

<h2>GestionPro Admin</h2>

<div class="card">

<input id="q" placeholder="deviceId o supportId">
<button onclick="loadUser()">Buscar</button>

<hr>

<div id="out"></div>

</div>

<script>

async function loadUser(){

  const q=document.getElementById("q").value.trim()

  if(!q)return

  const r=await fetch("/api/admin/user?query="+encodeURIComponent(q))

  const j=await r.json()

  document.getElementById("out").innerText=
    JSON.stringify(j,null,2)

}

</script>

</body>
</html>
