<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GestionPro Admin</title>
</head>
<body>
<h2>GestionPro Admin (versión corregida)</h2>

<input id="q" placeholder="deviceId o supportId" />
<button onclick="loadUser()">Buscar</button>

<hr/>

<div>
  <strong>deviceId:</strong> <span id="deviceId">—</span><br/>
  <strong>Total:</strong> <span id="kTotal">—</span><br/>
  <strong>Usados:</strong> <span id="kUsed">—</span><br/>
  <strong>Restantes:</strong> <span id="kRem">—</span><br/>
</div>

<hr/>

<button onclick="addCredits(10)">+10</button>
<button onclick="addCredits(30)">+30</button>

<script>
const API_BASE = "";

let currentDeviceId = null;

async function api(path, opts={}){
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      ...(opts.headers||{})
    }
  });
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch { data = { raw: txt }; }
  return { res, data };
}

async function loadUser(){
  const query = document.getElementById("q").value.trim();
  if(!query) return alert("Pon un deviceId o supportId");

  const { res, data } = await api(`/api/admin/user?query=${encodeURIComponent(query)}`);

  if(!data || !data.ok){
    alert("Error: " + (data?.error || res.status));
    return;
  }

  currentDeviceId = data.deviceId;

  document.getElementById("deviceId").textContent = data.deviceId;
  document.getElementById("kTotal").textContent = data.quota.total;
  document.getElementById("kUsed").textContent = data.quota.used;
  document.getElementById("kRem").textContent = data.quota.remaining;
}

async function addCredits(amount){
  if(!currentDeviceId){
    alert("Primero busca usuario");
    return;
  }

  const body = {
    deviceId: currentDeviceId,
    credits: amount
  };

  const { res, data } = await api(`/api/admin/add-credits`, {
    method:"POST",
    body: JSON.stringify(body)
  });

  if(!data || !data.ok){
    alert("Error al sumar: " + (data?.error || res.status));
    return;
  }

  alert("Créditos añadidos correctamente");
  await loadUser();
}
</script>

</body>
</html>
